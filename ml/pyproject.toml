[project]
name = "steamscoop-ml"
version = "0.1.0"
description = "SteamScoop Machine Learning, Evaluation, and Pipeline Artifacts"
requires-python = ">=3.11"
authors = [
    { name = "SteamScoop ML Team" }
]
dependencies = [
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.2.1,<3.0.0",
    "scikit-learn>=1.4.1,<2.0.0",
    "torch>=2.2.1,<3.0.0",
    "transformers>=4.38.2,<5.0.0",
    "sentence-transformers>=2.5.1,<3.0.0",
    "bertopic>=0.16.0,<1.0.0",
    "mlflow>=2.11.1,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0,<9.0.0",
    "ruff>=0.3.2,<1.0.0",
    "mypy>=1.9.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

